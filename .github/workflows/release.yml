name: CI

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag whose CHANGELOG.md patchnotes should be posted to Discord"
        required: true
        type: string

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate repo-managed locales
        run: python3 scripts/validate_repo_locales.py

      - name: Hack around https://github.com/actions/checkout/issues/290
        run: |
          git fetch --tags --force

      - name: Prepare packager gates
        run: bash scripts/prepare_packager_gates.sh "${GITHUB_REF_NAME}"

      - name: Validate gated package Lua
        uses: nebularg/actions-luacheck@v1
        with:
          args: "--no-color -q"
          annotate: warning

      - name: Prepare release changelog
        run: python3 scripts/prepare_release_changelog.py "${GITHUB_REF_NAME}"

      - name: Create Package and release
        uses: BigWigsMods/packager@v2
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CURSE_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI }}

      - name: Check Enhanced Damage Meter changes
        id: enhanced_damage_meter_changes
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -z "${previous_tag}" ]; then
            echo "No previous tag found; triggering Enhanced Damage Meter build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          paths=(
            "EnhanceQoL/Submodules/DamageMeter.lua"
            "EnhanceQoL/Core/EditMode.lua"
            "EnhanceQoL/Core/EditModeLib.lua"
            "EnhanceQoL/Locales"
            "EnhanceQoL/libs/EnhanceQoLEditMode"
            "EnhanceQoL/libs/LibSharedMedia-3.0"
            "EnhanceQoL/libs/AceLocale-3.0"
            "EnhanceQoL/libs/AceSerializer-3.0"
            "EnhanceQoL/libs/CallbackHandler-1.0"
            "EnhanceQoL/libs/LibDeflate"
            "EnhanceQoL/libs/LibStub"
          )

          if git diff --quiet "${previous_tag}" "${GITHUB_SHA}" -- "${paths[@]}"; then
            echo "No Enhanced Damage Meter relevant changes since ${previous_tag}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Enhanced Damage Meter relevant changes detected since ${previous_tag}."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Enhanced Damage Meter release
        if: steps.enhanced_damage_meter_changes.outputs.changed == 'true'
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.ENHANCED_DAMAGE_METER_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "ENHANCED_DAMAGE_METER_DISPATCH_TOKEN is not configured; skipping Enhanced Damage Meter dispatch." >&2
            exit 0
          fi

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/R41z0r/EnhancedDamageMeter/dispatches" \
            -d '{"event_type":"enhanceqol_release","client_payload":{"source_ref":"'"${GITHUB_REF_NAME}"'","source_sha":"'"${GITHUB_SHA}"'"}}'

  discord_patchnotes:
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Post patchnotes to Discord
        run: python3 scripts/post_discord_patchnotes.py
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          DISCORD_BETA_WEBHOOK: ${{ secrets.DISCORD_BETA_WEBHOOK }}
          DISCORD_ALPHA_WEBHOOK: ${{ secrets.DISCORD_ALPHA_WEBHOOK }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
